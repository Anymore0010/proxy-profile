########################################################################
# MITM
########################################################################
[mitm]

# 证书必须在本机生成，任何证书私钥都不应提交到仓库。
# Quantumult X：风车 → 设置 → MITM → 生成证书 → 安装描述文件 → 到「设置-通用-关于本机-证书信任设置」开启信任。
# 重导配置**不会**清除已生成的证书；若每次都要重新生成，那是证书本身没被信任。

# 本段不写 hostname：各 rewrite_remote 资源自带 hostname，QX 会自动并入 MITM。
# 若确需额外主机名（资源没声明的），请在 QX 界面的 MITM 页面添加，或在此写 hostname = a.com, *.b.com。

# 与 fmz 的 QuanX.conf、用户原 QX 配置保持一致（两边都显式设了 true）。
skip_validating_cert = true
passphrase = 
p12 = 
